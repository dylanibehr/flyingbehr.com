---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%B %-d, %Y" }}
    </time>
  </header>

  {% if page.image %}
  <div class="post-hero">
    <img src="{{ page.image }}" alt="{{ page.title }}">
  </div>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

  <nav class="post-nav">
    {% if page.previous.url %}
    <a class="post-nav-prev" href="{{ page.previous.url }}">&larr; {{ page.previous.title }}</a>
    {% endif %}
    {% if page.next.url %}
    <a class="post-nav-next" href="{{ page.next.url }}">{{ page.next.title }} &rarr;</a>
    {% endif %}
  </nav>
</article>
